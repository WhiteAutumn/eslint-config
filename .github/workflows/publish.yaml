name: Publish to NPM

on:
  release:
    types: [created]

jobs:

  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - run: npm ci

      - run: npm publish --access public